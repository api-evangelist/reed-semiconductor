    though the company markets automotive and ADAS parts — that absence is a finding, not
    an oversight on our part.
domain_standard:
  claimed_in_contract: false
  candidate: PMBus
  note: >-
    REWARD-ONLY CHECK, NOT AWARDED. PMBus is the domain standard for digital power
    management and Reed's own newsroom advertises "PMBus digital telemetry" on the RS31512
    and RS31390 eFuses, so the company genuinely speaks it. But PMBus is an I2C-layer
    device protocol implemented in silicon; it is not declared by, or reachable through,
    any API contract Reed publishes. The product records that mention it carry the string
    only inside prose HTML in `description`. Recorded here for accuracy and explicitly NOT
    counted as domain-standard conformance of the contract.
