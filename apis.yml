- aid: reed-semiconductor-content-api
  name: Reed Semiconductor Content API
  description: 'The WordPress REST API (wp/v2) served from the Reed Semiconductor corporate
    site. Anonymous read access to newsroom posts, pages, media, categories and taxonomies
    — the machine-readable form of the Reedsemi newsroom, which publishes product
    introductions, funding announcements and patent-proceeding news.'
  humanURL: https://www.reedsemi.com/newsroom/
