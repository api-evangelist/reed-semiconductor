aid: reed-semiconductor
name: Reed Semiconductor
description: 'Reed Semiconductor Corp. is a fabless power-management semiconductor company
  founded in 2019 and headquartered in Rhode Island, USA, with offices in Taipei, Shenzhen
  and Bengaluru. The name stands for Robust, Efficient, Eco-friendly and Dense power
  solutions. It designs multiphase DC-DC controllers, smart power stages, half-bridge
  power stages, point-of-load converters, power modules, intermediate bus converters,
  eFuses and power multiplexers for data center and AI/HPC accelerators, 48V and 12V
  distribution, communication and datacom equipment, automotive ADAS and infotainment,
  industrial systems and personal electronics. Reed does not operate a developer program,
  but its WordPress/WooCommerce corporate site exposes real machine-readable surfaces:
  an anonymous WooCommerce Store API serving the 99-part parametric product catalog
  across 81 application and technology categories, the WordPress content API, and an
  OAuth 2.1 protected Model Context Protocol server published through RFC 8414 and RFC
  9728 metadata at the apex domain.'
