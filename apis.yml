apis:
- aid: reed-semiconductor-store-api
  name: Reed Semiconductor Store API
  description: 'The WooCommerce Store API served from the Reed Semiconductor corporate
    site. Anonymous, read-only over the product catalog: 99 power-management parts
    (multiphase controllers, smart power stages, eFuses, power modules, IBCs, POL converters)
    organised into 81 categories spanning applications (Data Center and AI, Automotive,
    Communication Equipment, Industrial, Personal Electronics) and technology axes (48V,
    12V, 3.3V, DC/DC module). Cart and checkout routes are mounted by WooCommerce but
    every product returns is_purchasable false with a zero price, so the surface is a
    catalog, not a storefront.'
  humanURL: https://www.reedsemi.com/products/
  baseURL: https://www.reedsemi.com/wp-json/wc/store/v1
