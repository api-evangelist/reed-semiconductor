- aid: reed-semiconductor:reed-semiconductor-mcp
  name: Reed Semiconductor MCP Server
  description: A Model Context Protocol server mounted at the Reed Semiconductor apex domain by the Novamira
    WordPress plugin (v1.11.4). It advertises itself through RFC 9728 protected-resource metadata and
    RFC 8414 authorization-server metadata, supports OAuth 2.1 authorization-code with PKCE S256, RFC
    7591 dynamic client registration and the RFC 8628 device-code grant, and gates every JSON-RPC method
    behind the single scope "mcp". An anonymous tools/list returns HTTP 401 with a WWW-Authenticate Bearer
    challenge, so the tool set and input schemas require authenticated introspection.
  humanURL: https://www.reedsemi.com/
  baseURL: https://www.reedsemi.com/wp-json/mcp/novamira-oauth
